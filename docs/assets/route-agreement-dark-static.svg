      <path d="M222 157 L232 162 L222 167 M707 157 L717 162 L707 167 M475 258 L483 269 L470 267 M753 237 L760 225 L747 229"
        class="arrows"/>
      <text x="584" y="129" text-anchor="middle" class="route-label blue">direct · a/100</text>
      <text x="600" y="249" text-anchor="middle" class="route-label violet">via dispute · a/200</text>
      <g>
          <circle cx="106" cy="162" r="12" fill="#080f20" stroke="#30425e" stroke-width="2"/>
          <circle cx="106" cy="162" r="4" fill="#a7b9d3"/>
          <text x="106" y="126" text-anchor="middle" class="state">COMMITTED</text>
        </g><g>
          <circle cx="350" cy="162" r="12" fill="#080f20" stroke="#30425e" stroke-width="2"/>
          <circle cx="350" cy="162" r="4" fill="#a7b9d3"/>
          <text x="350" y="126" text-anchor="middle" class="state">DELIVERED</text>
        </g><g>
          <circle cx="600" cy="294" r="12" fill="#080f20" stroke="#30425e" stroke-width="2"/>
          <circle cx="600" cy="294" r="4" fill="#a7b9d3"/>
          <text x="600" y="352" text-anchor="middle" class="state">DISPUTED</text>
