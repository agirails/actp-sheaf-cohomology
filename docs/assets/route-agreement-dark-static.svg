          <circle cx="350" cy="162" r="4" fill="#a7b9d3"/>
          <text x="350" y="126" text-anchor="middle" class="state">DELIVERED</text>
        </g><g>
          <circle cx="600" cy="294" r="12" fill="#080f20" stroke="#30425e" stroke-width="2"/>
          <circle cx="600" cy="294" r="4" fill="#a7b9d3"/>
          <text x="600" y="352" text-anchor="middle" class="state">DISPUTED</text>
        </g><g>
          <circle cx="860" cy="162" r="12" fill="#080f20" stroke="#30425e" stroke-width="2"/>
          <circle cx="860" cy="162" r="4" fill="#a7b9d3"/>
          <text x="860" y="126" text-anchor="middle" class="state">SETTLED</text>
        </g>
      <g class="arrival" aria-hidden="true">
        <circle cx="860" cy="162" r="27" fill="none" stroke="#7de4c2" stroke-width="2"/>
        <circle cx="860" cy="162" r="17" fill="#7de4c2" fill-opacity="0.16"/>
        <circle cx="860" cy="162" r="6" fill="#7de4c2"/>
      </g>
      
      <path d="M790 353 H939" stroke="#7de4c2" stroke-width="1" opacity="0.5"/>
      <text x="940" y="385" text-anchor="end" class="result" fill="#7de4c2">fee = a/100</text>
    </g>
  <path d="M48 610 H952" stroke="#30425e"/>
  
    <g transform="translate(0 637)" class="case mismatch">
      <circle cx="51" cy="30" r="6" fill="#ffc27a"/>
      <text x="70" y="40" class="case-title">A seeded fee mismatch.</text>
