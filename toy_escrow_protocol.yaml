# toy_escrow_protocol.yaml
# Minimal 3-state escrow protocol for methodology validation.
# Used in Section 8 ("Generality beyond ACTP") of the paper.
#
# Expected results:
#   1-complex H^1 = 0  (acyclic, full field carry-through)
#   2-complex H^1 = 0  (no faces needed, graph is a tree)
#
# Removing "amount" from the DELIVER -> RELEASE carries list does NOT
# raise H^1: the graph is a tree, so H^1 stays 0. The edit shrinks C^1
# from 10 to 9 and raises H^0 from 7 to 8 (RELEASE's amount is no longer
# tied to DELIVER's). field_loss stays 0 because RELEASE still holds
# amount in its stalk; the edge appears only in field_loss's unscored
# per-edge "dropped" detail. To make field_loss score the gap, remove
# amount from RELEASE's stalk (and from that carries list) instead:
# field_loss then scores 1.

states:
  LOCK:
    stalks:
      - transaction_id
      - payer_address
      - payee_address
      - amount
      - escrow_hash

  DELIVER:
    stalks:
      - transaction_id
      - payer_address
      - payee_address
      - amount
      - escrow_hash
      - delivery_proof

  RELEASE:
    stalks:
      - transaction_id
      - payer_address
      - payee_address
      - amount
      - escrow_hash
      - settlement_tx

transitions:
  - from: LOCK
    to: DELIVER
    name: deliver
    carries:
      - transaction_id
      - payer_address
      - payee_address
      - amount
      - escrow_hash

  - from: DELIVER
    to: RELEASE
    name: release
    carries:
      - transaction_id
      - payer_address
      - payee_address
      - amount
      - escrow_hash

paths:
  happy:
    states: [LOCK, DELIVER, RELEASE]
    expect_h1: 0

expect_h1:
  1complex: 0
